<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Ruas - Não Bater</title>
    
    <!-- Google Fonts & Ícones Material -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .btn-gps {
            background-color: #0d9488;
            color: white;
        }

        .btn-gps.active {
            background-color: var(--danger);
        }

        .location-badge {
            background: #f8fafc;
            border: 1px dashed var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .location-badge strong {
            color: var(--text-main);
        }

        /* Cards de Alerta */
        .card-alert {
            background-color: var(--danger-bg);
            border: 1px solid #fca5a5;
            border-left: 6px solid var(--danger);
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            animation: fadeIn 0.3s ease;
        }

        .alert-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--danger);
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .address-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .address-item {
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            border: 1px solid #fee2e2;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .address-item::before {
            content: "";
            width: 8px;
            height: 8px;
            background-color: var(--danger);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-box {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-muted);
            background: #f8fafc;
            border: 1px solid var(--border);
        }

        .gps-alert-box {
            background-color: #fef3c7;
            border: 1px solid #fde047;
            color: #92400e;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>
            <span class="material-icons-round" style="color: var(--danger);">report_problem</span>
            Alerta: Não Bater
        </h2>
        <p>Monitoramento contínuo de ruas com restrição.</p>
    </div>

    <!-- Botão de Ação GPS -->
    <div class="button-group">
        <button id="btnGPS" class="btn btn-gps" onclick="alternarMonitoramentoGPS()">
            <span class="material-icons-round">my_location</span> Iniciar GPS
        </button>
    </div>

    <!-- Indicador de Localização Atual -->
    <div id="infoGPS" class="location-badge" style="display: none;">
        <span class="material-icons-round" style="font-size: 18px; color: var(--primary);">near_me</span>
        <div>GPS Atual: <strong id="ruaGPS">Aguardando coordenadas...</strong> (Precisão: <span id="precisaoGPS">--</span>m)</div>
    </div>

    <!-- Container de Status/Resultados -->
    <div id="resultados">
        <div class="status-box" id="statusInicial">
            Carregando banco de dados local...
        </div>
    </div>
</div>

<script>
    // VARIÁVEIS GLOBAIS DE ESTADO
    let baseDadosLocal = [];
    let watchId = null;
    let ultimaLat = 0;
    let ultimaLon = 0;
    let timerRepeticaoAlerta = null;
    let emRuaProibidaAtualmente = false;

    // Normalização rigorosa de texto (remove acentos, pontuações e padroniza maiúsculas)
    function normalizarTexto(texto) {
        if (!texto) return "";
        return texto
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/^(RUA|AVENIDA|AV|ALAMEDA|TRAVESSA|ESTRADA|PCA|PRAÇA)\.?\s*/i, "")
            .replace(/\s+/g, " ")
            .trim()
            .toUpperCase();
    }

    function carregarBancoDeDados() {
        const statusElem = document.getElementById('statusInicial');
        try {
            const dadosCache = localStorage.getItem('naoBater_cache');
            
            if (dadosCache) {
                const dadosBrutos = JSON.parse(dadosCache);
                baseDadosLocal = dadosBrutos.map(item => {
                    const original = item.textoCompleto || "";
                    return {
                        textoCompleto: original,
                        textoExibicao: item.textoExibicao || original,
                        textoNormalizado: normalizarTexto(original)
                    };
                });

                if (statusElem) {
                    statusElem.innerHTML = `Banco de dados local pronto (<b>${baseDadosLocal.length}</b> registros). Inicie o GPS para começar.`;
                }
            } else {
                if (statusElem) {
                    statusElem.innerHTML = `<span style="color:var(--danger);">Nenhum cache encontrado localmente. Execute a tela de carregamento primeiro.</span>`;
                }
            }
        } catch (error) {
            console.error("Erro ao carregar cache local:", error);
            if (statusElem) {
                statusElem.innerHTML = `<span style="color:var(--danger);">Erro ao carregar dados do cache local.</span>`;
            }
        }
    }

    carregarBancoDeDados();

    // Sistema de Áudio / Fala e Vibração Contínua
    function dispararAlertasCompletos(nomeRuaDetectada) {
        // Vibração por 5 segundos (padrão contínuo/pulsado)
        if (navigator.vibrate) {
            navigator.vibrate([1000, 200, 1000, 200, 1000, 200, 1000]);
        }

        // Aviso sonoro contínuo por 5 segundos (Beep)
        tocarAlertaSonoro5Segundos();

        // Síntese de voz oficial (falar o nome da rua)
        falarTextoVoz(`Atenção. Você entrou na rua ${nomeRuaDetectada}. Existe um registro de Não Bater.`);
    }

    function tocarAlertaSonoro5Segundos() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const duracao = 5.0; 
            const frequencia = 750; 
            const tempoInicio = audioCtx.currentTime;

            for (let i = 0; i < duracao; i += 0.5) {
                const oscilador = audioCtx.createOscillator();
                const ganho = audioCtx.createGain();

                oscilador.type = 'sine';
                oscilador.frequency.setValueAtTime(frequencia, tempoInicio + i);

                ganho.gain.setValueAtTime(0.2, tempoInicio + i);
                ganho.gain.exponentialRampToValueAtTime(0.001, tempoInicio + i + 0.3);

                oscilador.connect(ganho);
                ganho.connect(audioCtx.destination);

                oscilador.start(tempoInicio + i);
                oscilador.stop(tempoInicio + i + 0.3);
            }
        } catch (e) {
            console.error("Erro ao gerar áudio:", e);
        }
    }

    function falarTextoVoz(mensagem) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Para falas anteriores para evitar acúmulo
            const fala = new SpeechSynthesisUtterance(mensagem);
            fala.lang = 'pt-BR';
            fala.rate = 1.0;
            window.speechSynthesis.speak(fala);
        }
    }

    // Controle do Monitoramento GPS Otimizado
    window.alternarMonitoramentoGPS = function() {
        const btnGPS = document.getElementById('btnGPS');
        const infoGPS = document.getElementById('infoGPS');
        const container = document.getElementById('resultados');

        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            pararRepeticaoAlerta();
            btnGPS.classList.remove('active');
            btnGPS.innerHTML = `<span class="material-icons-round">my_location</span> Iniciar GPS`;
            infoGPS.style.display = 'none';
            container.innerHTML = `<div class="status-box">Monitoramento GPS interrompido.</div>`;
            return;
        }

        if (!navigator.geolocation) {
            container.innerHTML = `<div class="status-box" style="color:var(--danger);">GPS não suportado neste navegador.</div>`;
            return;
        }

        btnGPS.classList.add('active');
        btnGPS.innerHTML = `<span class="material-icons-round">stop</span> Parar GPS`;
        infoGPS.style.display = 'flex';
        document.getElementById('ruaGPS').innerText = 'Buscando sinal de alta precisão...';

        // Configuração com alta precisão e alta frequência (a cada 2 segundos via highAccuracy)
        watchId = navigator.geolocation.watchPosition(
            async function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const precisao = pos.coords.accuracy;

                document.getElementById('precisaoGPS').innerText = Math.round(precisao);

                // REQUISITO: Ignorar leituras com precisão maior que 20 metros
                if (precisao > 20) {
                    document.getElementById('ruaGPS').innerText = "Sinal fraco (aguardando precisão < 20m)...";
                    return;
                }

                // REQUISITO: Consultar novamente apenas se andar mais de 5 metros
                const distanciaPercorrida = calcularDistanciaMetros(lat, lon, ultimaLat, ultimaLon);
                if (distanciaPercorrida < 5 && ultimaLat !== 0) {
                    return;
                }

                ultimaLat = lat;
                ultimaLon = lon;

                try {
                    document.getElementById('ruaGPS').innerText = 'Identificando rua atual...';

                    // Consulta otimizada no Nominatim com limite de cache nativo e timeout curto
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=pt-BR`, {
                        cache: 'force-cache'
                    });
                    const data = await response.json();

                    let nomeRua = data.address.road || data.address.pedestrian || data.address.suburb || "";

                    if (!nomeRua) {
                        document.getElementById('ruaGPS').innerText = "Rua não identificada pelo GPS.";
                        pararRepeticaoAlerta();
                        return;
                    }

                    document.getElementById('ruaGPS').innerText = nomeRua;

                    // Validação contra o banco local
                    pesquisarNaMemoriaFlexivel(nomeRua);

                } catch (err) {
                    console.error("Erro na Geocodificação:", err);
                    document.getElementById('ruaGPS').innerText = "Erro ao buscar nome da rua.";
                }
            },
            function(err) {
                console.error("Erro no GPS:", err);
                document.getElementById('ruaGPS').innerText = "Erro de permissão ou sinal GPS.";
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 1000 // Atualiza a cada segundo se necessário
            }
        );
    };

    // Pesquisa flexível utilizando palavras semelhantes e sem se preocupar com número de casa
    function pesquisarNaMemoriaFlexivel(termoBusca) {
        const container = document.getElementById('resultados');
        const termoLimpo = normalizarTexto(termoBusca);

        if (baseDadosLocal.length === 0) {
            container.innerHTML = `<div class="status-box">Base de dados local vazia. Verifique o cache.</div>`;
            return;
        }

        // Compara ignorando números e focando nas palavras semelhantes do nome da rua
        let encontrados = baseDadosLocal.filter(item => {
            const ruaCadastradaLimpa = item.textoNormalizado.split(/,\s*(N[ºO°]|NUMERO|APTO|CASA)/i)[0].trim();
            
            // Verifica correspondência parcial por palavras semelhantes (incluindo subpartes)
            return ruaCadastradaLimpa.includes(termoLimpo) || termoLimpo.includes(ruaCadastradaLimpa);
        });

        if (encontrados.length > 0) {
            // Se entrou em rua proibida pela primeira vez ou mudou de rua proibida
            if (!emRuaProibidaAtualmente) {
                emRuaProibidaAtualmente = true;
                dispararAlertasCompletos(termoBusca);

                // REQUISITO: Repetir o aviso sonoro enquanto permanecer na rua (a cada 6 segundos)
                iniciarRepeticaoAlerta(termoBusca);
            }

            let itemsHtml = encontrados.map(item => `<div class="address-item">${item.textoExibicao}</div>`).join('');

            container.innerHTML = `
                <div class="gps-alert-box">
                    <span class="material-icons-round">warning</span>
                    ATENÇÃO: Você está em uma rua com restrição registrada!
                </div>
                <div class="card-alert">
                    <div class="alert-header">
                        <span class="material-icons-round">error</span>
                        Atenção: Não Bater (${encontrados.length})
                    </div>
                    <div class="address-list">
                        ${itemsHtml}
                    </div>
                </div>
            `;
        } else {
            // Saiu da rua proibida
            pararRepeticaoAlerta();
            emRuaProibidaAtualmente = false;

            container.innerHTML = `
                <div class="status-box" style="background-color: var(--success-bg); color: var(--success); border-color: #bbf7d0;">
                    <span class="material-icons-round" style="vertical-align: middle; margin-right: 4px;">check_circle</span>
                    Nenhum registro de "Não Bater" para <b>${termoBusca}</b>. Liberado.
                </div>
            `;
        }
    }

    function iniciarRepeticaoAlerta(nomeRua) {
        pararRepeticaoAlerta();
        timerRepeticaoAlerta = setInterval(() => {
            if (emRuaProibidaAtualmente) {
                dispararAlertasCompletos(nomeRua);
            } else {
                pararRepeticaoAlerta();
            }
        }, 7000); // Repete o ciclo completo de alerta a cada 7 segundos enquanto estiver na mesma rua restrita
    }

    function pararRepeticaoAlerta() {
        if (timerRepeticaoAlerta) {
            clearInterval(timerRepeticaoAlerta);
            timerRepeticaoAlerta = null;
        }
    }

    function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
        if (!lat2 || !lon2) return 999;
        const R = 6371e3;
        const p1 = lat1 * Math.PI / 180;
        const p2 = lat2 * Math.PI / 180;
        const dp = (lat2 - lat1) * Math.PI / 180;
        const dl = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(dp/2) * Math.sin(dp/2) +
                  Math.cos(p1) * Math.cos(p2) *
                  Math.sin(dl/2) * Math.sin(dl/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c;
    }
</script>

</body>
</html>
