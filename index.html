<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Ruas - Não Bater</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .btn-gps {
            background-color: #0d9488;
            color: white;
        }

        .btn-gps.active {
            background-color: var(--danger);
        }

        .location-badge {
            background: #f8fafc;
            border: 1px dashed var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .location-badge strong {
            color: var(--text-main);
        }

        .card-alert {
            background-color: var(--danger-bg);
            border: 1px solid #fca5a5;
            border-left: 6px solid var(--danger);
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            animation: fadeIn 0.3s ease;
        }

        .alert-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--danger);
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .address-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .address-item {
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            border: 1px solid #fee2e2;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .address-item::before {
            content: "";
            width: 8px;
            height: 8px;
            background-color: var(--danger);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-box {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-muted);
            background: #f8fafc;
            border: 1px solid var(--border);
        }

        /* Estilização do grupo recolhível (Details / Summary) */
        .settings-details {
            margin-top: 24px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .settings-summary {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            background: #f1f5f9;
        }

        .settings-summary:hover {
            color: var(--text-main);
        }

        .settings-content {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid var(--border);
            background: #ffffff;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
        }

        .toggle-item span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Switch personalizado */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>
            <span class="material-icons-round" style="color: var(--danger);">report_problem</span>
            Alerta: Não Bater
        </h2>
        <p>Monitoramento contínuo de ruas com restrição.</p>
    </div>

    <div class="button-group">
        <button id="btnGPS" class="btn btn-gps" onclick="alternarMonitoramentoGPS()">
            <span class="material-icons-round">my_location</span> Iniciar GPS
        </button>
    </div>

    <div id="infoGPS" class="location-badge" style="display: none;">
        <span class="material-icons-round" style="font-size: 18px; color: var(--primary);">near_me</span>
        <div>GPS Atual: <strong id="ruaGPS">Aguardando coordenadas...</strong></div>
    </div>

    <div id="resultados">
        <div class="status-box" id="statusInicial">
            Conectando ao Firebase...
        </div>
    </div>

    <!-- Grupo Recolhível de Configurações no Fim -->
    <details class="settings-details">
        <summary class="settings-summary">
            <span class="material-icons-round" style="font-size: 18px;">settings</span>
            Configurações
        </summary>
        <div class="settings-content">
            <label class="toggle-item">
                <span><span class="material-icons-round" style="font-size: 18px;">vibration</span> Vibração</span>
                <label class="switch">
                    <input type="checkbox" id="toggleVibracao" onchange="salvarConfiguracoes()">
                    <span class="slider"></span>
                </label>
            </label>
            <label class="toggle-item">
                <span><span class="material-icons-round" style="font-size: 18px;">volume_up</span> Alerta Sonoro</span>
                <label class="switch">
                    <input type="checkbox" id="toggleSom" onchange="salvarConfiguracoes()">
                    <span class="slider"></span>
                </label>
            </label>
        </div>
    </details>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCceXCFz8Vopi-Hzr6mWORGX39lSzyl_rg",
        authDomain: "cache-3c4cc.firebaseapp.com",
        projectId: "cache-3c4cc",
        storageBucket: "cache-3c4cc.firebasestorage.app",
        messagingSenderId: "385957817347",
        appId: "1:385957817347:web:a3ef859c2bbd8f2ae63236"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let baseDadosLocal = [];
    let watchId = null;
    let ultimaLat = 0;
    let ultimaLon = 0;
    let ultimaRuaAnalisada = "";

    // Carregar configurações salvas no localStorage ao iniciar
    function carregarConfiguracoes() {
        const vibCache = localStorage.getItem('config_vibracao');
        const somCache = localStorage.getItem('config_som');

        const inputVib = document.getElementById('toggleVibracao');
        const inputSom = document.getElementById('toggleSom');

        // Se houver cache, usa; senão, o padrão é desativado (false)
        inputVib.checked = vibCache !== null ? vibCache === 'true' : false;
        inputSom.checked = somCache !== null ? somCache === 'true' : false;
    }

    // Salvar configurações no localStorage sempre que houver alteração
    window.salvarConfiguracoes = function() {
        const vibVal = document.getElementById('toggleVibracao').checked;
        const somVal = document.getElementById('toggleSom').checked;

        localStorage.setItem('config_vibracao', vibVal);
        localStorage.setItem('config_som', somVal);
    }

    // Executa a leitura do cache logo na inicialização
    carregarConfiguracoes();

    function normalizarTexto(texto) {
        if (!texto) return "";
        return texto
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/^(RUA|AVENIDA|AV|ALAMEDA|TRAVESSA|ESTRADA|PCA|PRACA|RODOVIA|ROD)\.?\s*/i, "")
            .replace(/[^a-zA-Z0-9\s]/g, "")
            .replace(/\s+/g, " ")
            .trim()
            .toUpperCase();
    }

    async function carregarBancoDoFirebase() {
        const statusElem = document.getElementById('statusInicial');
        try {
            const querySnapshot = await getDocs(collection(db, "ruas"));
            const ruasSet = new Set();

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const endereco = (data["ruas"] || data["ENDERECO"] || data["ENDEREÇO"] || Object.values(data)[0] || "").trim();
                if (endereco) {
                    ruasSet.add(endereco);
                }
            });

            baseDadosLocal = Array.from(ruasSet).map(original => ({
                textoCompleto: original,
                textoExibicao: original,
                textoNormalizado: normalizarTexto(original)
            }));

            if (statusElem) {
                statusElem.innerHTML = `Banco carregado do Firebase! (<b>${baseDadosLocal.length}</b> itens).`;
            }
        } catch (error) {
            console.error("Erro ao carregar do Firebase:", error);
            if (statusElem) {
                statusElem.innerHTML = `<span style="color:var(--danger);">Erro ao carregar dados do Firebase. Verifique as Regras do Firestore.</span>`;
            }
        }
    }

    carregarBancoDoFirebase();

    function dispararAlertasCompletos() {
        const ativarVibracao = document.getElementById('toggleVibracao').checked;
        const ativarSom = document.getElementById('toggleSom').checked;

        if (ativarVibracao && navigator.vibrate) {
            navigator.vibrate([1000, 200, 1000, 200, 1000, 200, 1000, 200, 1000]);
        }
        if (ativarSom) {
            tocarAlertaSonoro5Segundos();
        }
    }

    function tocarAlertaSonoro5Segundos() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const duracao = 5.0; 
            const frequencia = 750; 
            const tempoInicio = audioCtx.currentTime;

            for (let i = 0; i < duracao; i += 0.5) {
                const oscilador = audioCtx.createOscillator();
                const ganho = audioCtx.createGain();

                oscilador.type = 'sine';
                oscilador.frequency.setValueAtTime(frequencia, tempoInicio + i);

                ganho.gain.setValueAtTime(0.2, tempoInicio + i);
                ganho.gain.exponentialRampToValueAtTime(0.001, tempoInicio + i + 0.3);

                oscilador.connect(ganho);
                ganho.connect(audioCtx.destination);

                oscilador.start(tempoInicio + i);
                oscilador.stop(tempoInicio + i + 0.3);
            }
        } catch (e) {
            console.error("Erro ao gerar áudio:", e);
        }
    }

    window.alternarMonitoramentoGPS = function() {
        const btnGPS = document.getElementById('btnGPS');
        const infoGPS = document.getElementById('infoGPS');
        const container = document.getElementById('resultados');

        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            ultimaRuaAnalisada = "";
            btnGPS.classList.remove('active');
            btnGPS.innerHTML = `<span class="material-icons-round">my_location</span> Iniciar GPS`;
            infoGPS.style.display = 'none';
            container.innerHTML = `<div class="status-box">Monitoramento GPS interrompido.</div>`;
            return;
        }

        if (!navigator.geolocation) {
            container.innerHTML = `<div class="status-box" style="color:var(--danger);">GPS não suportado neste navegador.</div>`;
            return;
        }

        btnGPS.classList.add('active');
        btnGPS.innerHTML = `<span class="material-icons-round">stop</span> Parar GPS`;
        infoGPS.style.display = 'flex';
        document.getElementById('ruaGPS').innerText = 'Obtendo sinal do GPS...';

        watchId = navigator.geolocation.watchPosition(
            async function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                const distanciaPercorrida = calcularDistanciaMetros(lat, lon, ultimaLat, ultimaLon);
                if (distanciaPercorrida < 3 && ultimaLat !== 0) {
                    return;
                }

                ultimaLat = lat;
                ultimaLon = lon;

                try {
                    document.getElementById('ruaGPS').innerText = 'Buscando nome da rua...';

                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=pt-BR`, {
                        cache: 'no-store'
                    });
                    const data = await response.json();

                    let nomeRua = "";
                    if (data && data.address) {
                        nomeRua = data.address.road || data.address.pedestrian || data.address.suburb || data.address.neighbourhood || "";
                    }

                    if (!nomeRua) {
                        document.getElementById('ruaGPS').innerText = "Rua não identificada neste ponto.";
                        return;
                    }

                    document.getElementById('ruaGPS').innerText = nomeRua;
                    
                    pesquisarNaMemoriaCompletamenteFlexivel(nomeRua);

                } catch (err) {
                    console.error("Erro na Geocodificação:", err);
                    document.getElementById('ruaGPS').innerText = "Erro ao buscar nome da rua.";
                }
            },
            function(err) {
                console.error("Erro no GPS:", err);
                document.getElementById('ruaGPS').innerText = "Erro de sinal GPS.";
            },
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    };

    function pesquisarNaMemoriaCompletamenteFlexivel(nomeRuaGPS) {
        const container = document.getElementById('resultados');
        const termoGPSLimpo = normalizarTexto(nomeRuaGPS);

        if (baseDadosLocal.length === 0) {
            container.innerHTML = `<div class="status-box" style="color:var(--danger);">O banco está vazio! Impossível comparar.</div>`;
            return;
        }

        let encontrados = baseDadosLocal.filter(item => {
            const itemLimpo = item.textoNormalizado;
            if (!itemLimpo) return false;

            return itemLimpo === termoGPSLimpo || 
                   itemLimpo.includes(termoGPSLimpo) || 
                   termoGPSLimpo.includes(itemLimpo);
        });

        if (encontrados.length > 0) {
            if (ultimaRuaAnalisada !== nomeRuaGPS) {
                ultimaRuaAnalisada = nomeRuaGPS;
                dispararAlertasCompletos();
            }

            let itemsHtml = encontrados.map(item => `<div class="address-item">${item.textoExibicao}</div>`).join('');

            container.innerHTML = `
                <div class="card-alert">
                    <div class="alert-header">
                        <span class="material-icons-round">error</span>
                        Atenção: Não Bater (${encontrados.length})
                    </div>
                    <div class="address-list">
                        ${itemsHtml}
                    </div>
                </div>
            `;
        } else {
            ultimaRuaAnalisada = nomeRuaGPS;

            container.innerHTML = `
                <div class="status-box" style="background-color: var(--success-bg); color: var(--success); border-color: #bbf7d0;">
                    <span class="material-icons-round" style="vertical-align: middle; margin-right: 4px;">check_circle</span>
                    Rua atual: <b>${nomeRuaGPS}</b>.<br>Nenhum registro encontrado.
                </div>
            `;
        }
    }

    function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
        if (!lat2 || !lon2) return 999;
        const R = 6371e3;
        const p1 = lat1 * Math.PI / 180;
        const p2 = lat2 * Math.PI / 180;
        const dp = (lat2 - lat1) * Math.PI / 180;
        const dl = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(dp/2) * Math.sin(dp/2) +
                  Math.cos(p1) * Math.cos(p2) *
                  Math.sin(dl/2) * Math.sin(dl/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c;
    }
</script>

</body>
</html>
